<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Categories Tree</title>
  <style>
    .loading-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(255,255,255,0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5em;
      font-weight: bold;
      color: #333;
      z-index: 9999;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    .loading-overlay.show {
      opacity: 1;
      pointer-events: all;
    }

    .spinner {
      margin-left: 10px;
      width: 24px;
      height: 24px;
      border: 3px solid #666;
      border-radius: 50%;
      border-top-color: transparent;
      animation: spin 0.8s linear infinite;
      display: inline-block;
      vertical-align: middle;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    .refresh-button {
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <button class="refresh-button">Обновить</button>
  <category-tree></category-tree>

  <div class="loading-overlay" id="loadingOverlay">
    Обновление...<span class="spinner"></span>
  </div>

  <script>
    class CategoryTree extends HTMLElement {
      constructor() {
        super();
        this.attachShadow({ mode: 'open' });
        const style = document.createElement('style');
        style.textContent = `
          ul {
            list-style-type: none;
            padding-left: 1em;
            margin: 0;
          }

          li {
            position: relative;
            margin: 4px 0;
            cursor: pointer;
          }

          li::before {
            content: "-";
            display: inline-block;
            margin-right: 0.5em;
            transition: transform 0.2s;
            font-weight: bold;
            width: 1em;
            text-align: center;
          }

          li[collapsed]::before {
            content: "+";
          }

          li[leaf]::before {
            content: "•";
          }

          li ul {
            margin-left: 1em;
            display: block;
          }

          li[collapsed] > ul {
            display: none;
          }

          li[leaf] .leaf-id {
            font-size: 0.9em;
            color: #666;
            margin-left: 0.5em;
            cursor: pointer;
            text-decoration: underline;
            position: relative;
            user-select: none;
          }

          li[leaf] .leaf-id:hover {
            color: #333;
          }

          .copy-message {
            position: absolute;
            left: 0;
            top: 100%;
            background: #333;
            color: #fff;
            font-size: 0.8em;
            padding: 3px 6px;
            border-radius: 4px;
            white-space: nowrap;
            z-index: 10;
            margin-top: 5px;
          }
        `;
        this.container = document.createElement('div');
        this.shadowRoot.append(style, this.container);
      }

      connectedCallback() {
        this.container.addEventListener('click', (event) => {
          const leafIdSpan = event.target.closest('.leaf-id');
          if (leafIdSpan) {
            const id = leafIdSpan.getAttribute('data-id');
            navigator.clipboard.writeText(id)
              .finally(() => {
                this._showCopyMessage(leafIdSpan, "Скопировано!");
              });
            return;
          }

          const li = event.target.closest('li');
          if (li && li.hasAttribute('data-id') && !event.target.classList.contains('leaf-id')) {
            // Если это не лист, нужно открыть/закрыть и возможно подгрузить детей
            if (!li.hasAttribute('leaf')) {
              let childUl = li.querySelector('ul');
              if (!childUl) {
                const parentId = li.getAttribute('data-id');
                const children = this._getChildren(parentId);
                if (children.length > 0) {
                  childUl = this._renderTree(children);
                  li.appendChild(childUl);
                } else {
                  li.setAttribute('leaf', '');
                }
              }
              // Тогглим collapsed
              if (li.hasAttribute('collapsed')) {
                li.removeAttribute('collapsed');
              } else {
                li.setAttribute('collapsed', '');
              }
            }
          }
        });
      }

      setData(data) {
        this.categoriesData = data;
        const rootCategories = this._getChildren("");
        this.container.innerHTML = '';
        const tree = this._renderTree(rootCategories);
        this.container.appendChild(tree);
      }

      _getChildren(parentId) {
        return this.categoriesData[parentId] || [];
      }

      _renderTree(nodes) {
        const ul = document.createElement('ul');
        for (const node of nodes) {
          const li = document.createElement('li');
          li.setAttribute('data-id', node.id);
          if (node.leaf) {
            li.setAttribute('leaf', '');
          } else {
            li.setAttribute('collapsed', '');
          }

          const nameSpan = document.createElement('span');
          nameSpan.textContent = node.name;
          nameSpan.style.userSelect = 'text';
          li.appendChild(nameSpan);

          if (node.leaf) {
            const idSpan = document.createElement('span');
            idSpan.className = 'leaf-id';
            idSpan.setAttribute('data-id', node.id);
            idSpan.textContent = `[ID: ${node.id}]`;
            li.appendChild(idSpan);
          }

          ul.appendChild(li);
        }
        return ul;
      }

      _showCopyMessage(targetEl, message) {
        const oldMessage = targetEl.querySelector('.copy-message');
        if (oldMessage) {
          oldMessage.remove();
        }

        const msgSpan = document.createElement('span');
        msgSpan.className = 'copy-message';
        msgSpan.textContent = message;

        targetEl.appendChild(msgSpan);

        setTimeout(() => {
          if (msgSpan.parentNode) {
            msgSpan.remove();
          }
        }, 2000);
      }
    }

    customElements.define('category-tree', CategoryTree);
  </script>

  <script>
    const categoriesData = {{ data|tojson }};
    document.addEventListener('DOMContentLoaded', () => {
      const tree = document.querySelector('category-tree');
      tree.setData(categoriesData);

      const refreshButton = document.querySelector('.refresh-button');
      const loadingOverlay = document.getElementById('loadingOverlay');

      refreshButton.addEventListener('click', async () => {
        // Показываем оверлей загрузки
        loadingOverlay.classList.add('show');
        refreshButton.disabled = true;

        try {
          const response = await fetch('/update-categories', { method: 'POST' });
          if (!response.ok) {
            throw new Error('Не удалось обновить категории');
          }
          // После успешного обновления перезагружаем страницу
          window.location.reload();
        } catch (err) {
          console.error(err);
          // Можно отображать сообщение об ошибке, если нужно
          loadingOverlay.classList.remove('show');
          refreshButton.disabled = false;
        }
      });
    });
  </script>
</body>
</html>
